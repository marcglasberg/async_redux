name: Build

on:
  push:
    branches:
      - master
      - develop
  pull_request:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
      - run: flutter pub get
      - run: dart pub get
        working-directory: async_redux_lints
      - run: dart analyze
      - run: dart analyze
        working-directory: async_redux_lints
      - run: dart test
        working-directory: async_redux_lints
      - run: flutter test
